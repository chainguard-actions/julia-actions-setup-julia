name: Test LTS version alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: 'lts'
      - name: Assert julia-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "actual julia-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          echo "PASS: julia-version=$ACTUAL"
      - name: Assert julia-bindir output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.julia-bindir }}
        run: |
          echo "actual julia-bindir: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: julia-bindir output is empty"
            exit 1
          fi
          echo "PASS: julia-bindir=$ACTUAL"
      - name: Assert julia is on PATH and runs
        run: |
          which julia || { echo "FAIL: julia not found on PATH"; exit 1; }
          julia --version || { echo "FAIL: julia --version failed"; exit 1; }
          echo "PASS: julia found and runs: $(julia --version)"
