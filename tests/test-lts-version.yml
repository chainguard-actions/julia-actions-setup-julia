name: Test LTS version alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "lts"
      - name: Assert julia-version output is set
        env:
          JULIA_VERSION: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "julia-version: $JULIA_VERSION"
          if [ -z "$JULIA_VERSION" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          # LTS should be a valid semver like X.Y.Z
          if ! echo "$JULIA_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: julia-version does not look like a semver: $JULIA_VERSION"
            exit 1
          fi
          echo "PASS: lts resolved to $JULIA_VERSION"
      - name: Assert julia-bindir output is set and valid
        env:
          JULIA_BINDIR: ${{ steps.setup.outputs.julia-bindir }}
        run: |
          echo "julia-bindir: $JULIA_BINDIR"
          if [ -z "$JULIA_BINDIR" ]; then
            echo "FAIL: julia-bindir output is empty"
            exit 1
          fi
          if [ ! -d "$JULIA_BINDIR" ]; then
            echo "FAIL: julia-bindir does not exist: $JULIA_BINDIR"
            exit 1
          fi
          echo "PASS: julia-bindir=$JULIA_BINDIR"
      - name: Assert julia is functional
        run: |
          julia --version
          if [ $? -ne 0 ]; then
            echo "FAIL: julia --version failed"
            exit 1
          fi
          echo "PASS"
