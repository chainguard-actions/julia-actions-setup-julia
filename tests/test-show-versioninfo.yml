name: Test show-versioninfo option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '1'
          show-versioninfo: 'true'
      - name: Assert julia-version output is set
        env:
          JULIA_VERSION: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "julia-version: $JULIA_VERSION"
          if [ -z "$JULIA_VERSION" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          echo "PASS: julia-version=$JULIA_VERSION"
      - name: Assert julia is functional after versioninfo display
        run: |
          # Verify julia can run a simple expression
          RESULT=$(julia -e 'println(1 + 1)')
          echo "julia 1+1 = $RESULT"
          if [ "$RESULT" != "2" ]; then
            echo "FAIL: expected '2' but got: $RESULT"
            exit 1
          fi
          echo "PASS: julia is functional"
