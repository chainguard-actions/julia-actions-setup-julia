name: Test show-versioninfo option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '1'
          show-versioninfo: 'true'
      - name: Assert julia-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "actual julia-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          echo "PASS: julia-version=$ACTUAL"
      - name: Assert julia is on PATH
        run: |
          which julia || { echo "FAIL: julia not found on PATH"; exit 1; }
          echo "PASS: julia found at $(which julia)"
      - name: Assert julia can run a simple expression
        run: |
          RESULT=$(julia -e 'println("hello from julia")')
          echo "julia output: $RESULT"
          if [ "$RESULT" != "hello from julia" ]; then
            echo "FAIL: expected 'hello from julia', got '$RESULT'"
            exit 1
          fi
          echo "PASS"
