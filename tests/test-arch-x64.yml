name: Test explicit x64 architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: '1'
          arch: 'x64'
      - name: Assert julia-version output is set
        env:
          JULIA_VERSION: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "julia-version: $JULIA_VERSION"
          if [ -z "$JULIA_VERSION" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          echo "PASS: julia-version=$JULIA_VERSION"
      - name: Assert julia-bindir output is set
        env:
          JULIA_BINDIR: ${{ steps.setup.outputs.julia-bindir }}
        run: |
          echo "julia-bindir: $JULIA_BINDIR"
          if [ -z "$JULIA_BINDIR" ]; then
            echo "FAIL: julia-bindir output is empty"
            exit 1
          fi
          echo "PASS: julia-bindir=$JULIA_BINDIR"
      - name: Assert julia is on PATH and is x86_64
        run: |
          which julia
          julia --version
          # Verify the binary architecture is x86_64
          ARCH=$(file "$(which julia)" | grep -oE 'x86-64|x86_64|ELF 64-bit' | head -1)
          echo "detected arch info: $ARCH"
          if [ -z "$ARCH" ]; then
            echo "WARN: could not detect arch from file command, checking julia itself"
            julia -e 'println(Sys.ARCH)'
            JULIA_ARCH=$(julia -e 'print(Sys.ARCH)')
            echo "julia Sys.ARCH: $JULIA_ARCH"
            if [ "$JULIA_ARCH" != "x86_64" ]; then
              echo "FAIL: expected x86_64, got $JULIA_ARCH"
              exit 1
            fi
          fi
          echo "PASS: x64 julia installed"
