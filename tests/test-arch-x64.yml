name: Test x64 architecture specification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: "1"
          arch: "x64"
      - name: Assert julia-version output is set
        env:
          JULIA_VERSION: ${{ steps.setup.outputs.julia-version }}
        run: |
          echo "julia-version: $JULIA_VERSION"
          if [ -z "$JULIA_VERSION" ]; then
            echo "FAIL: julia-version output is empty"
            exit 1
          fi
          echo "PASS: julia-version=$JULIA_VERSION"
      - name: Assert julia-bindir output is set and valid
        env:
          JULIA_BINDIR: ${{ steps.setup.outputs.julia-bindir }}
        run: |
          echo "julia-bindir: $JULIA_BINDIR"
          if [ -z "$JULIA_BINDIR" ]; then
            echo "FAIL: julia-bindir output is empty"
            exit 1
          fi
          if [ ! -d "$JULIA_BINDIR" ]; then
            echo "FAIL: julia-bindir does not exist: $JULIA_BINDIR"
            exit 1
          fi
          echo "PASS: julia-bindir=$JULIA_BINDIR"
      - name: Assert julia is on PATH and runs
        run: |
          if ! command -v julia >/dev/null 2>&1; then
            echo "FAIL: julia not found on PATH"
            exit 1
          fi
          julia --version
          echo "PASS: julia found at $(command -v julia)"
      - name: Assert julia binary is x86_64
        run: |
          JULIA_BIN="$(command -v julia)"
          FILE_OUTPUT="$(file "$JULIA_BIN" 2>/dev/null || true)"
          echo "file output: $FILE_OUTPUT"
          # On Linux, verify it's a 64-bit ELF or a script pointing to one
          JULIA_VERSION_OUT="$(julia -e 'println(Sys.ARCH)')"
          echo "Sys.ARCH: $JULIA_VERSION_OUT"
          if [ "$JULIA_VERSION_OUT" != "x86_64" ]; then
            echo "FAIL: expected x86_64 arch, got: $JULIA_VERSION_OUT"
            exit 1
          fi
          echo "PASS: arch is x86_64"
